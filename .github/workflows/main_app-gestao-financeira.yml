name: Build and Deploy Laravel App to Azure Web App - app-gestao-financeira

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: '1. Checkout do código'
        uses: actions/checkout@v4

      - name: '2. Configurar PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          
      - name: '3. Criar arquivo .env para produção'
        # ESTE PASSO VEM PRIMEIRO! Essencial para todos os comandos seguintes.
        run: echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env
        
      - name: '4. Instalar dependências do Composer (sem scripts)'
        # Adicionamos --no-scripts para evitar que 'php artisan' seja executado automaticamente.
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader --no-scripts

      - name: '5. Configurar Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: '6. Instalar dependências do NPM'
        run: npm install

      - name: '7. Compilar Assets de Frontend (Vite/Mix)'
        run: npm run build

      - name: '8. Gerar chave da aplicação Laravel'
        # Agora este comando roda com o .env correto no lugar.
        run: php artisan key:generate --force

      - name: '9. Criar caches de otimização do Laravel'
        # E os comandos de cache também usarão a conexão correta (ex: MySQL do Azure).
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
      
      - name: '10. Criar artefato .zip para deploy'
        run: zip release.zip . -r

      - name: '11. Upload do artefato para o job de deploy'
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    
    steps:
      - name: '1. Download do artefato do job de build'
        uses: actions/download-artifact@v4
        with:
          name: laravel-app

      - name: '2. Login no Azure'
        # ... (login no Azure permanece o mesmo)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_887C6D08AC6A4D90AF2332B9B8BE948E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F902404B50244BF186E5B9D85A485063 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5404614CFD6347C48792F0862349A638 }}

      - name: '3. Deploy para o Azure Web App'
        # ... (deploy para o Azure permanece o mesmo)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-gestao-financeira'
          slot-name: 'Production'
          package: 'release.zip'
