# Manual de instruções para o GitHub (VERSÃO CORRIGIDA)
name: Enviar site para Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Passo 1: Baixar o código
      - name: 'Baixar o código'
        uses: actions/checkout@v4

      # Passo 2: Preparar o PHP
      - name: 'Preparar PHP 8.2'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      # Passo 3: Preparar o Node.js
      - name: 'Preparar Node.js'
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ----> NOVO PASSO ADICIONADO AQUI <----
      # Passo 4: Criar .env para a build
      - name: 'Criar .env para a build'
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          php artisan config:clear

      # Passo 5: Instalar pacotes do Composer
      - name: 'Instalar pacotes do Composer'
        run: composer install --prefer-dist --no-progress --no-dev -o

      # Passo 6: Instalar pacotes do NPM
      - name: 'Instalar pacotes do NPM'
        run: npm install

      # Passo 7: Compilar CSS e JS
      - name: 'Compilar CSS e JS'
        run: npm run build

      # Passo 8: Usar o crachá para fazer login na Azure
      - name: 'Fazer login na Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Passo 9: Enviar os arquivos para o App Service
      - name: 'Enviar arquivos para o App Service'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'SEU_NOME_DO_APP' # <<< LEMBRE-SE DE TROCAR AQUI
          package: .
